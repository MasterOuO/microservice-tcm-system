<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>管理員介面</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{css/styles.css}">
  <link rel="stylesheet" th:href="@{css/sidebar.css}">
</head>

<body>
	<!-- 頂部 Navbar (小螢幕時會顯示漢堡按鈕) -->
	<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #07393C;">
	  <div class="container-fluid">
	    <!-- 漢堡按鈕 (在大螢幕也會顯示, 但可視需要 d-lg-none) -->
	    <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileOffcanvas" aria-controls="mobileOffcanvas" aria-label="Toggle navigation">
	      <span class="navbar-toggler-icon"></span>
	    </button>
	    
	    
	    <!-- 右側：使用者姓名 & 登出 -->
	    <div class="ms-auto text-white d-flex align-items-center">
	    	<span class="w3-bar-item w3-right" style="margin-right: 10px">Hi, [[${userDetails.getFullname()}]]</span>
	     	<a class="btn btn-outline-light btn-sm" th:href="@{logout}" sec:authorize="isAuthenticated">登出</a>
	    </div>
	  </div>
	</nav>

	<div class="container-fluid">
	  <div class="row">	    
	    <!-- 側邊欄 -->
	    <div class="col-2 sidebar d-none d-lg-block" >
	      <div class="sidebar-heading">行政人員管理系統</div>
	      <hr/>
	      <nav class="nav flex-column">
	        <a class="nav-link" th:href="@{admin-page}">人員列表</a>
	        <a class="nav-link" th:href="@{admin-page/schedule}">醫師排班</a>
	        <a class="nav-link" th:href="@{admin-page/create}">新增醫師</a>
	        <a class="nav-link" th:href="@{all_Patient}">病患查詢</a>
	      </nav>
	    </div>
	    
		<div class="col">
			<div class="container mt-4">
			<h2 class="title">新增醫生</h2>
				<div class="row">
					<div class="col-md-8 mx-auto rounded border p-4 m-4">
						<form method="post" th:object="${userDto}">
						
							<div class="row mb-3">
								<label class="col-sm-4 col-form-label">帳號</label>
								<div class="col-sm-8">
									<input class="form-control" th:field="*{account}">
									<p th:if="${#fields.hasErrors('account')}" th:errorclass="text-danger" th:errors="*{account}"></p>
								</div>
							</div>
							
							<div class="row mb-3">
								<label class="col-sm-4 col-form-label">姓名</label>
								<div class="col-sm-8">
									<input class="form-control" th:field="*{fullname}">
									<p th:if="${#fields.hasErrors('fullname')}" th:errorclass="text-danger" th:errors="*{fullname}"></p>
								</div>
							</div>
							
							<div class="row mb-3">
								<label class="col-sm-4 col-form-label">密碼</label>
								<div class="col-sm-8">
									<input class="form-control" type="password" th:field="*{password}">
									<p th:if="${#fields.hasErrors('password')}" th:errorclass="text-danger" th:errors="*{password}"></p>
								</div>
							</div>
									
							<div class="row mb-3">
								<label class="col-sm-4 col-form-label">權限</label>
								<div class="col-sm-8">
									<select class="form-select" th:field="*{role}">
										<option value="" selected disabled>--請選擇人員權限--</option>
										<option value="doctor">醫生</option>
										<option value="admin">行政</option>
									</select>
								</div>
							</div>	
							
							<div class="row">
								<div class="offset-sm-4 col-sm-4 d-grid">
									<button type="submit" class="btn btn-primary">提交</button>
								</div>
								<div class="col-sm-4 d-grid">
									<a class="btn btn-outline-primary" href="/admin-page" role="button">取消</a>
								</div>
								
							</div>
							
						</form>
					</div>
				</div>	
			</div>
		</div>	
	  </div> <!-- /row -->
	</div> <!-- /container-fluid -->

	<!-- 小螢幕專用: Offcanvas (漢堡選單) -->
	<div class="offcanvas offcanvas-start d-lg-none" tabindex="-1" id="mobileOffcanvas" aria-labelledby="mobileOffcanvasLabel">
	  <div class="offcanvas-header">
	    <h5 class="offcanvas-title" id="mobileOffcanvasLabel">功能選單</h5>
	    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
	  </div>
	  <div class="offcanvas-body">
	    <ul class="nav flex-column">
	      <li class="nav-item mb-2">
	        <a class="nav-link" th:href="@{/admin-page}">人員列表</a>
	      </li>
	      <li class="nav-item mb-2">
	        <a class="nav-link" th:href="@{/admin-page/schedule}">醫師排班</a>
	      </li>
	      <li class="nav-item mb-2">
	        <a class="nav-link" th:href="@{/admin-page/create}">新增醫師</a>
	      </li>
	      <li class="nav-item mb-2">
	        <a class="nav-link" th:href="@{/all_Patient}">病患查詢</a>
	      </li>
	    </ul>
	  </div>
	</div>

<!-- Bootstrap JS -->
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
></script>
</body>
</html>
