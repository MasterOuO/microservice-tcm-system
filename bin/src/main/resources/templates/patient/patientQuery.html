<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>病患預約查詢片段</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{../css/styles.css}">
</head>
<body>
<div>
    <div class="container" style="margin-top : 20px">
        <h3>病患查詢結果</h3>
        

        <div th:if="${errorMessage}" class="alert alert-danger mt-4">
            <p th:text="${errorMessage}"></p>
        </div>

        <table class="table">
            <thead>
                <tr>
                    <th>選擇醫生</th>
                    <th>名字</th>
                    <th>身分證</th>
                    <th>預約日期</th>
                    <th>預約時間</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="patient : ${patient}">
                    <td th:text="${patient.selectDoctor}"></td>
                    <td th:text="${patient.name}"></td>
                    <td th:text="${patient.identity}"></td>
                    <td th:text="${patient.appointment_date}"></td>
                    <td th:text="${patient.appointment_time}"></td>
                    <td style="white-space:nowrap">
                        <a class="btn btn-primary btn-sm" th:href="@{/editPatient(id=${patient.id})}">編輯</a>
                        <a class="btn btn-danger btn-sm" th:href="@{/deletePatient(id=${patient.id})}" onclick="return confirm('確定要刪除嗎')">刪除</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <div class="col-sm-4 d-grid">
			<a class="btn btn-outline-primary" href="/appointment" role="button">回首頁</a>
		</div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
