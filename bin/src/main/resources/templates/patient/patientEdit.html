<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>預約紀錄</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{../css/styles.css}">
  </head>
  <body>
  	<div class="container">
		<div class="row">
			<div class="col-md-8 mx-auto rounded border p-4 m-4">
				<h2 class="text-center mb-5">編輯預約紀錄</h2>
				
				<form method="post" th:object="${patientDto}">
					
					<div class="row mb-3" style="display: none">
						<label class="col-sm-4 col-form-label">ID</label>
						<div class="col-sm-8">
							<input readonly class="form-control-plaintext" th:value="${patient.id}">
						</div>
					</div>
					
					<div class="row mb-3">
						<label class="col-sm-4 col-form-label">選擇醫生</label>
						<div class="col-sm-8">
							<select class="form-select" th:field="${patientDto.select_doctor}">
								<option value='doctor1'>doctor1</option>
							</select>
							<p th:if="${#fields.hasErrors('select_doctor')}" th:errorclass="text-danger" th:errors="${patientDto.select_doctor}"></p>
						</div>
					</div>
					
					<div class="row mb-3">
						<label class="col-sm-4 col-form-label">名字</label>
						<div class="col-sm-8">
							<input class="form-control" th:field="${patientDto.name}">
							<p th:if="${#fields.hasErrors('name')}" th:errorclass="text-danger" th:errors="${patientDto.name}"></p>
						</div>
					</div>
					
					<div class="row mb-3">
						<label class="col-sm-4 col-form-label">身分證</label>
						<div class="col-sm-8">
							<input class="form-control" th:field="${patientDto.identity}">
							<p th:if="${#fields.hasErrors('identity')}" th:errorclass="text-danger" th:errors="${patientDto.identity}"></p>
						</div>
					</div>
									
		        	<div class="row mb-3">
						<label class="col-sm-4 col-form-label">預約日期</label>
						<div class="col-sm-8">
							<input class="form-control" th:field="${patientDto.appointment_date}">
							<p th:if="${#fields.hasErrors('appointment_date')}" th:errorclass="text-danger" th:errors="${patientDto.appointment_date}"></p>
						</div>
					</div>
		  
					<div class="row mb-3">
						<label class="col-sm-4 col-form-label">預約時間</label>
						<div class="col-sm-8">
							<select class="form-select" th:field="${patientDto.appointment_time}">
								<option value="" selected disabled>--Time--</option>
							</select>
							<p th:if="${#fields.hasErrors('appointment_time')}" th:errorclass="text-danger" th:errors="${patientDto.appointment_time}"></p>
						</div>
					</div>
					
					<div class="row">
						<div class="offset-sm-4 col-sm-4 d-grid">
							<button type="submit" class="btn btn-primary" th:href="@{/editPatient}">更新</button>
						</div>
						<div class="col-sm-4 d-grid">
							<a class="btn btn-outline-primary" th:href="@{/getPatient(identity=${patientDto.identity})}" role="button">取消</a>
						</div>
					</div>
					
				</form>
			</div>
		</div>	
  	</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
