<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>管理員介面</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{css/styles.css}">
  <link rel="stylesheet" th:href="@{css/sidebar.css}">
</head>

<body>

  <!-- ✅ navbar -->
  <th:block th:replace="~{fragments/navbar :: topbar(${userDetails})}"></th:block>

  <div class="container-fluid">
    <div class="row">

      <!-- ✅ row 裡只放 col：sidebar -->
      <th:block th:replace="~{fragments/sidebar :: sidebarCol(${base})}"></th:block>

      <!-- ✅ row 裡只放 col：main -->
      <div class="col">
        <div class="container mt-4">
          <h2 class="title">人員列表</h2>

          <div class="table-responsive">
            <table class="table table-bordered align-middle">
              <thead class="table-light">
                <tr>
                  <th>帳號</th>
                  <th>姓名</th>
                  <th>工作時間</th>
                  <th>action</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="user : ${users}">
                  <td th:text="${user.account}"></td>
                  <td th:text="${user.fullname}"></td>
                  <td th:text="${user.work_day}"></td>
                  <td style="white-space:nowrap">
                    <a class="btn btn-primary btn-sm"
                       th:href="@{${base} + '/admin-page/edit'(id=${user.id})}">編輯</a>

                    <a class="btn btn-danger btn-sm"
                       th:href="@{${base} + '/admin-page/delete'(id=${user.id})}"
                       onclick="return confirm('確定要刪除這筆資料嗎?')">刪除</a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- ✅ offcanvas 永遠放 row 外面 -->
  <th:block th:replace="~{fragments/sidebar :: offcanvas(${base})}"></th:block>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
