<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人員登入</title>   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <div class="container main-container">
        <!-- 系統消息 .error .logout默認 -->
        <div th:if="${param.error}" class="message alert-danger" id="error-message">
            帳號或密碼錯誤
        </div>
        <div th:if="${param.logout}" class="message alert-success" id="logout-message">
            登出成功
        </div>

        <!-- 系統標題 -->
        <h2 class="text-center title">中醫辨證系統</h2>

        <div class="row gx-4 gy-4 mt-4 justify-content-center">
	    <!-- 左欄：醫師 / 行政人員登入 -->
	    <div class="col-md-8">
	        <div class="login-section shadow-sm p-4 rounded">
	            <h3 class="section-title">醫師 / 行政人員登入</h3>
	            <form th:action="@{/login}" method="post" role="form" th:object="${user}">
	                <div class="form-group mb-3">
	                    <label for="username">帳號</label>
	                    <input 
	                        type="text" 
	                        id="username" 
	                        name="username" 
	                        class="form-control"
	                        placeholder="輸入帳號"
	                    >
	                </div>
	                <div class="form-group mb-3">
	                    <label for="password">密碼</label>
	                    <input 
	                        th:field="*{password}"
	                        type="password"
	                        id="password"
	                        name="password"
	                        class="form-control"
	                        placeholder="輸入密碼"
	                    >
	                </div>
	                <button type="submit" class="btn btn-submit">登入</button>
	            </form>
	        </div>
	    </div>
	</div>

	</div>

    <!-- 訊息自動消失 Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const displayDuration = 2000; 
            const errorMessage = document.getElementById("error-message");
            const logoutMessage = document.getElementById("logout-message");

            if (errorMessage) {
                setTimeout(() => {
                    errorMessage.style.transition = "opacity 1s ease-out";
                    errorMessage.style.opacity = 0;
                    setTimeout(() => errorMessage.remove(), 500);
                }, displayDuration);
            }
            if (logoutMessage) {
                setTimeout(() => {
                    logoutMessage.style.transition = "opacity 1s ease-out";
                    logoutMessage.style.opacity = 0;
                    setTimeout(() => logoutMessage.remove(), 500);
                }, displayDuration);
            }
        });
    </script>
</body>
</html>
