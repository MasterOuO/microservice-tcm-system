<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>預約紀錄</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/smoothness/jquery-ui.css">
    <link rel="stylesheet" th:href="@{../css/styles.css}">
  </head>
  <body>
  	<div class="container">
		<div class="row">
			<div class="col-md-8 mx-auto rounded border p-4 m-4">
				<h2 class="text-center mb-5">編輯預約紀錄</h2>
				
				<form method="post" th:object="${patientDto}">
					
					<div class="row mb-3" style="display: none">
						<label class="col-sm-4 col-form-label">ID</label>
						<div class="col-sm-8">
							<input readonly class="form-control-plaintext" th:value="${patient.id}">
						</div>
					</div>
					
					<div class="row mb-3">
						<label class="col-sm-4 col-form-label">選擇醫生</label>
						<div class="col-sm-8">
							<select id="doctorSelect" class="form-select" >
							    <option th:each="doc : ${doctors}"
							            th:value="${doc.id}" 
							            th:text="${doc.fullname}">
							    </option>
							</select>
							<input type="hidden" th:field="*{selectDoctor}" id="doctorFullname"/>
							<!--
							<select class="form-select" th:field="${patientDto.selectDoctor}">
								 <option value='doctor1'>doctor1</option> 
							</select>
							-->
							<p th:if="${#fields.hasErrors('selectDoctor')}" th:errorclass="text-danger" th:errors="${patientDto.selectDoctor}"></p>
						</div>
					</div>
					
					<div class="row mb-3">
						<label class="col-sm-4 col-form-label">名字</label>
						<div class="col-sm-8">
							<input class="form-control" th:field="${patientDto.name}">
							<p th:if="${#fields.hasErrors('name')}" th:errorclass="text-danger" th:errors="${patientDto.name}"></p>
						</div>
					</div>
					
					<div class="row mb-3">
						<label class="col-sm-4 col-form-label">身分證</label>
						<div class="col-sm-8">
							<input class="form-control" th:field="${patientDto.identity}">
							<p th:if="${#fields.hasErrors('identity')}" th:errorclass="text-danger" th:errors="${patientDto.identity}"></p>
						</div>
					</div>
									
		        	<div class="row mb-3">
						<label class="col-sm-4 col-form-label">預約日期</label>
						<div class="col-sm-8">
							<input id="appDate" class="form-control" th:field="${patientDto.appointmentDate}" autocomplete="off">
							<p th:if="${#fields.hasErrors('appointmentDate')}" th:errorclass="text-danger" th:errors="${patientDto.appointmentDate}"></p>
						</div>
					</div>
		  
					<div class="row mb-3">
						<label class="col-sm-4 col-form-label">預約時間</label>
						<div class="col-sm-8">
							<select id="timeSelect" class="form-select" th:field="${patientDto.appointmentTime}">
								<option value="" selected disabled>--Time--</option>
							</select>
							<p th:if="${#fields.hasErrors('appointmentTime')}" th:errorclass="text-danger" th:errors="${patientDto.appointmentTime}"></p>
						</div>
					</div>
					
					<div class="row">
						<div class="offset-sm-4 col-sm-4 d-grid">
							<button type="submit" class="btn btn-primary" th:href="@{/editPatient}">更新</button>
						</div>
						<div class="col-sm-4 d-grid">
							<a class="btn btn-outline-primary" th:href="@{/getPatient(identity=${patientDto.identity})}" role="button">取消</a>
						</div>
					</div>
					
				</form>
			</div>
		</div>	
  	</div>
    <!-- jQuery + jQuery UI JS -->
	
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
	
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    
	<script>
        document.addEventListener("DOMContentLoaded", function(){
			const displayDuration = 2000;
			const successMessage = document.getElementById("success-message");
			if(successMessage){
				setTimeout(() => {
					successMessage.style.transition = "opacity 0.5s ease-out";
					successMessage.style.opacity = 0;
					setTimeout(() =>successMessage.remove(), 500);
				}, displayDuration);
			}
			
		let availableDates = [];
		
		const doctorFullname = document.getElementById("doctorFullname");
		
		$('#doctorSelect').on("change", function(){
			let doctorId = $(this).val();
			if(!doctorId) return;
			doctorFullname.value = this.options[this.selectedIndex].text;
			
			$.ajax({
				url: "/api/" + doctorId + "/dates",
				type: "GET",
				dataType: "json",
				success: function(response){
					if(response.success){
						availableDates = response.dates;
						//清空日期與時段
						$('#appDate').val("");
						$('#timeSelect').empty().append(`<option value="" disabled selected>--Time--</option>`);
					} else{
						console.log("取得可用日期失敗:", response.message);
						availableDates = [];
					}
				},
				error: function(e){
					console.log("拉可用日期發生錯誤",e);
					availableDates = [];
				}
			});
		});
		
		//初始化datepicker
		$('#appDate').datepicker({
			dateFormat: "yy-mm-dd",
			//minDate: new Date(2025, 1, 19) => 202-02-19 => 1=二月(因JS月份為0-based)
			//改成實時 => new Date() => 今天
			minDate: new Date(),
			
			beforeShowDay: function(date){
				//date => JS Date obj
				let y = date.getFullYear();
				let m = (date.getMonth() + 1).toString().padStart(2, '0');
				let d = date.getDate().toString().padStart(2, '0');
				let dateStr = `${y}-${m}-${d}`;
				//若在availableDate => [true, "green"] => 可選
				//不在 => [false, ""] => 禁用
				if(availableDates.includes(dateStr)){
					return [true, "greenDay"];
				} else{
					return [false,""];
				}
			},
			
			onSelect: function(selectedDate){
				let doctorId = $("#doctorSelect").val();
				if(!doctorId){
					alert("請先選擇醫生");
					return ;
				}
				//清空時段
				$("#timeSelect").empty().append(`<option value="" disabled selected>--Time--</option>`);
				
				$.ajax({
					url: "api/" + doctorId + "/times?date=" + selectedDate,
					type: "GET",
					dataType: "json",
					success: function(response){
						if(response.success){
							let slots = response.timeSlots;
							slots.forEach(slot => { $("#timeSelect").append(`<option value="${slot}">${slot}</option>`);
							});
						}
					},
					error: function(e){
						console.log("拉時段發生錯誤", e);
					}
				});
			 }
		 });	
	 });   
    </script>
    
  </body>
</html>
