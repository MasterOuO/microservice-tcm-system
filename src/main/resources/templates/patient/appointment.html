<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>預約看診</title>   
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- jQuery UI CSS (Datepicker) -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/smoothness/jquery-ui.css">
    <!-- 連結到你的 CSS -->
    <link rel="stylesheet" th:href="@{css/styles.css}">
    <style>
	  .greenDay{
	  	background-color: #b0e6b0;
	  	color: #000;
	  }
	</style>
</head>

<body>
    <div class="container main-container">

		<div th:if="${successMessage}" class="message alert-success" id="success-message">
			<span th:text="${successMessage}"></span>
		</div>

        <!-- 系統標題 -->
        <h2 class="text-center title">中醫門診系統</h2>

        <div class="row gx-4 gy-4 mt-4 justify-content-center">      
            <!-- 右欄：病患預約掛號 & 查詢 -->
            <div class="col-md-8">
                <div class="patient-section shadow-sm p-4 rounded">
                    <h3 class="section-title">病患預約掛號</h3>
                    <form th:action="@{createPatient}" method="post" role="form" th:object="${patientDto}">
                        
                        
                        <div class="mb-3">
                            <label for="selectDoctor" class="form-label">選擇醫生</label>
                            <select class="form-select" id="doctorSelect">
                                <option value="">--選擇醫生--</option>
                                <option
                                    th:each="doctor : ${doctors}"
                                    th:value="${doctor.id}"
                                    th:text="${doctor.fullname}">
                                </option>
                            </select>
                            <input type="hidden" th:field="*{selectDoctor}" id="doctorFullname"/>
                            <p th:if="${#fields.hasErrors('selectDoctor')}" class="text-danger" th:errors="*{selectDoctor}"></p>
                        </div>
                        
                        <div class="mb-3">
                            <label for="name">姓名</label>
                            <input class="form-control" th:field="*{name}" type="text">
                            <p th:if="${#fields.hasErrors('name')}" class="text-danger" th:errors="*{name}"></p>
                        </div>
                        
                        <div class="mb-3">
                            <label for="identity">身分證字號</label>
                            <input class="form-control" th:field="*{identity}" type="text">
                            <p th:if="${formWithErrors == 'createPatient'}" class="text-danger">
                                <span th:each="error : ${#fields.errors('identity')}" th:text="${error}"></span>
                            </p>
                        </div>
                        
                        <div class="mb-3">
                            <label>預約日期</label>
							<input type="text" class="form-control" th:field="*{appointmentDate}" id="appDate" placeholder="選擇日期" readonly />
                        </div>
                        
                        <div class="mb-3">
                            <label>預約時段</label>
                            <select class="form-select" th:field="*{appointmentTime}" id="timeSelect">
                                <option value="" selected disabled>--Time--</option>
                            </select>
                        </div>
                        
                        <button type="submit" class="btn btn-submit">預約</button>
                    </form>
                </div>

                <div class="patient-search-section shadow-sm p-4 rounded">
                    <h3 class="section-title">病患預約查詢</h3>
                    <form th:action="@{getPatient}" method="post" role="form" th:object="${patientDto}">
                        <div class="mb-3">
                            <label for="identity">身分證字號</label>
                            <input class="form-control" th:field="*{identity}" type="text">
                            <p th:if="${formWithErrors == 'getPatient'}" class="text-danger">
                                <span th:each="error : ${#fields.errors('identity')}" th:text="${error}"></span>
                            </p>
                        </div>
                        <button type="submit" class="btn btn-submit">查詢</button>
                    </form>
                </div>
            </div>
		</div>
	</div>	
	
	<!-- jQuery + jQuery UI JS -->
	
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script>
        document.addEventListener("DOMContentLoaded", function(){
			const displayDuration = 2000;
			const successMessage = document.getElementById("success-message");
			if(successMessage){
				setTimeout(() => {
					successMessage.style.transition = "opacity 0.5s ease-out";
					successMessage.style.opacity = 0;
					setTimeout(() =>successMessage.remove(), 500);
				}, displayDuration);
			}
			
		let availableDates = [];
		
		const doctorFullname = document.getElementById("doctorFullname");
		
		$('#doctorSelect').on("change", function(){
			let doctorId = $(this).val();
			if(!doctorId) return;
			doctorFullname.value = this.options[this.selectedIndex].text;
			
			$.ajax({
				url: "/api/" + doctorId + "/dates",
				type: "GET",
				dataType: "json",
				success: function(response){
					if(response.success){
						availableDates = response.dates;
						//清空日期與時段
						$('#appDate').val("");
						$('#timeSelect').empty().append(`<option value="" disabled selected>--Time--</option>`);
					} else{
						console.log("取得可用日期失敗:", response.message);
						availableDates = [];
					}
				},
				error: function(e){
					console.log("拉可用日期發生錯誤",e);
					availableDates = [];
				}
			});
		});
		
		//初始化datepicker
		$('#appDate').datepicker({
			dateFormat: "yy-mm-dd",
			//minDate: new Date(2025, 1, 19) => 202-02-19 => 1=二月(因JS月份為0-based)
			//改成實時 => new Date() => 今天
			minDate: new Date(),
			
			beforeShowDay: function(date){
				//date => JS Date obj
				let y = date.getFullYear();
				let m = (date.getMonth() + 1).toString().padStart(2, '0');
				let d = date.getDate().toString().padStart(2, '0');
				let dateStr = `${y}-${m}-${d}`;
				//若在availableDate => [true, "green"] => 可選
				//不在 => [false, ""] => 禁用
				if(availableDates.includes(dateStr)){
					return [true, "greenDay"];
				} else{
					return [false,""];
				}
			},
			
			onSelect: function(selectedDate){
				let doctorId = $("#doctorSelect").val();
				if(!doctorId){
					alert("請先選擇醫生");
					return ;
				}
				//清空時段
				$("#timeSelect").empty().append(`<option value="" disabled selected>--Time--</option>`);
				
				$.ajax({
					url: "api/" + doctorId + "/times?date=" + selectedDate,
					type: "GET",
					dataType: "json",
					success: function(response){
						if(response.success){
							let slots = response.timeSlots;
							slots.forEach(slot => { $("#timeSelect").append(`<option value="${slot}">${slot}</option>`);
							});
						}
					},
					error: function(e){
						console.log("拉時段發生錯誤", e);
					}
				});
			 }
		 });	
	 });   
    </script>

</body>
</html>
