<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>醫生看診介面</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{css/styles.css}">
  <link rel="stylesheet" th:href="@{css/sidebar.css}">
  <link rel="stylesheet" th:href="@{css/diff.css}">
</head>
<div style="padding: 20px; border: 1px solid #ccc; margin-top: 20px;">
    <h3>針灸穴位測試 (UI -> Gateway -> 8093)</h3>
    <input type="text" id="bodyPart" placeholder="輸入部位 (如: head)">
    <button onclick="testAcupuncture()">測試撈取資料</button>

    <div id="resultDisplay" style="margin-top: 15px; background: #f9f9f9; padding: 10px;">
        <p>狀態: <span id="status">-</span></p>
        <ul id="pointList"></ul>
    </div>
</div>

<script>
function testAcupuncture() {
    const part = document.getElementById('bodyPart').value || "head";
    
    // 改用絕對路徑指向 UI 轉接點
    fetch(`/api-test?part=${part}`)
        .then(res => res.json())
        .then(data => {
            console.log("最終收到資料:", data);
            if (data.status === "success") {
                document.getElementById('status').innerText = "成功！";
                const list = document.getElementById('pointList');
                list.innerHTML = data.points.map(p => `<li>${p}</li>`).join('');
            } else {
                document.getElementById('status').innerText = "失敗: " + data.message;
            }
        })
        .catch(err => {
            document.getElementById('status').innerText = "連線異常: " + err;
        });
}
</script>
</html>
