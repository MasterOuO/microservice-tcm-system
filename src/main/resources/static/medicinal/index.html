<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中醫方劑研究資料輸入系統</title>
    <style>
        body { 
            background-color: #dcf2ea; 
            font-family: "Microsoft JhengHei", sans-serif; 
            padding: 30px; 
            display: flex; 
            justify-content: center; 
            color: #2c3e50;
        }
        .container { width: 100%; max-width: 1200px; }
        h2 { text-align: center; color: #1b5e20; margin-bottom: 25px; font-size: 1.8rem; }
        .main-panel { 
            background-color: #ffffff; 
            border: 1px solid #c8e6c9; 
            border-radius: 12px; 
            padding: 30px; 
            box-shadow: 0 4px 16px rgba(46, 125, 107, 0.08); 
        }
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .full-row { grid-column: span 3; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { 
            font-weight: bold; 
            margin-bottom: 8px; 
            color: #2e7d6b; 
            border-left: 4px solid #2e7d6b; 
            padding-left: 8px; 
            font-size: 15px;
        }
        textarea { 
            width: 100%; 
            min-height: 95px; 
            padding: 12px; 
            font-size: 15px; 
            line-height: 1.5; 
            border: 1.5px solid #a3d9c9; 
            border-radius: 8px; 
            box-sizing: border-box; 
            outline: none; 
            transition: all 0.2s; 
            resize: vertical; 
            background: #fafdfc;
        }
        textarea:focus { 
            border-color: #2e7d6b; 
            background-color: #fff; 
            box-shadow: 0 0 6px rgba(46, 125, 107, 0.2); 
        }
        .btn-box { margin-top: 25px; display: flex; justify-content: flex-end; gap: 15px; }
        button { 
            padding: 11px 30px; 
            font-size: 15px; 
            cursor: pointer; 
            border: none; 
            border-radius: 6px; 
            color: white; 
            font-weight: bold; 
            transition: all 0.2s; 
        }
        .btn-green { background-color: #2e7d6b; }
        .btn-green:hover { background-color: #236354; transform: translateY(-1px); }
        .btn-red { background-color: #304910; }
        .btn-red:hover { background-color: #d32f2f; transform: translateY(-1px); }
    </style>
</head>
<body>
<div class="container">
    <h2>方劑研究資料輸入系統</h2>
    <div class="main-panel">
        <div class="grid-container">
            <div class="input-group"><label>方劑名稱</label><textarea id="name"></textarea></div>
            <div class="input-group"><label>證候</label><textarea id="symptoms"></textarea></div>
            <div class="input-group"><label>君藥 (藥材:療效1、療效2...;)</label><textarea id="king"></textarea></div>
            <div class="input-group"><label>臣藥 (藥材:療效1、療效2...;)</label><textarea id="minister"></textarea></div>
            <div class="input-group"><label>佐藥 (藥材:療效1、療效2...;)</label><textarea id="assistant"></textarea></div>
            <div class="input-group"><label>使藥 (藥材:療效1、療效2...;)</label><textarea id="envoy"></textarea></div>
            <div class="input-group full-row"><label>偏序關係 (格式：療效:藥A>藥B; 功效:藥C>藥D)</label><textarea id="relation"></textarea></div>
        </div>
    </div>
    <div class="btn-box">
        <button class="btn-red" onclick="reset()">清除內容</button>
        <button class="btn-green" onclick="submit()">確認新增到資料庫</button>
    </div>
</div>
<script>
	const GATEWAY_URL = `http://${window.location.hostname}:8080/api/medicinal`;

    document.querySelectorAll('textarea').forEach(t => { 
        t.oninput = () => { 
            t.style.height = 'auto'; 
            t.style.height = t.scrollHeight + 'px'; 
        }; 
    });

    async function submit() {
        const relationField = document.getElementById('relation');
        let relationRaw = relationField.value.trim();
        let relationClean = relationRaw.replace(/\n/g, ' ');

        const data = {
            name: document.getElementById('name').value.trim(),
            symptoms: document.getElementById('symptoms').value.trim(),
            king: document.getElementById('king').value.trim(),
            minister: document.getElementById('minister').value.trim(),
            assistant: document.getElementById('assistant').value.trim(),
            envoy: document.getElementById('envoy').value.trim(),
            relation: relationClean
        };

        if (!data.name) { 
            alert("請務必輸入「方劑名稱」！"); 
            return; 
        }

        const relationPattern = /^([^:;]+:[^:;>]+(>[^:;]+)?(;\s*|$))+$/;
        if (data.relation && !relationPattern.test(data.relation)) { 
            alert("格式錯誤！\n偏序關係輸入規則請參考欄位上方提示"); 
            return; 
        }

        try {
            const res = await fetch(`${GATEWAY_URL}/add`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json(); 
            alert(result.msg); 
            resetFields(); 
        } catch (e) { 
            console.error(e);
            alert("傳送失敗！請檢查 Gateway 與後端服務連線。"); 
        }
    }

    function reset() { 
        if (confirm("確定要清空畫面上所有的輸入內容嗎？")) {
            resetFields(); 
        }
    }

    function resetFields() { 
        document.querySelectorAll('textarea').forEach(t => { 
            t.value = ""; 
            t.style.height = '95px'; 
        }); 
    }
</script>
</body>
</html>
