<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>中醫方劑效力值推論系統 - 報表中心</title>
    <style>
        body { 
            font-family: "Microsoft JhengHei", sans-serif; 
            padding: 25px 0; 
            background-color: #dcf2ea; 
            display: flex;
            flex-direction: column;
            align-items: center; 
            color: #2c3e50;
        }
        .container {
            width: 55%; 
            min-width: 650px; 
            max-width: 950px; 
        }
        .header-box { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #b2dfdb; 
            padding-bottom: 12px; 
            margin-bottom: 20px; 
        }
        h1 { font-size: 1.6rem; margin: 0; color: #1b5e20; }
        .effect-card { 
            background: white; 
            border-radius: 10px; 
            box-shadow: 0 3px 10px rgba(46, 125, 107, 0.08); 
            margin-bottom: 18px; 
            overflow: hidden; 
            border: 1px solid #c8e6c9;
        }
        .effect-title { 
            background: #2e7d6b; 
            color: white; 
            padding: 10px 20px; 
            font-size: 1.2rem; 
            font-weight: bold; 
        }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 9px 20px; text-align: left; border-bottom: 1.5px solid #e0ece9; background: #eef7f4; font-size: 1.05rem; color: #2e7d6b; }
        td { padding: 9px 20px; text-align: left; border-bottom: 1px solid #f0f7f5; font-size: 1.1rem; }
        .score-badge { display: inline-block; padding: 3px 12px; border-radius: 15px; font-weight: bold; font-size: 1rem; }
        .high-score { background-color: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
        .mid-score { background-color: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
        .low-score { background-color: #fafafa; color: #9e9e9e; border: 1px solid #e0e0e0; }
        .btn-group { display: flex; gap: 8px; }
        .btn { border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; font-size: 13.5px; transition: all 0.2s; }
        .btn-blue { background: #2e7d6b; }
        .btn-orange { background: #5cc082; }
        .btn-purple { background: #26a68a; }
        .btn-green { background: #388e3c; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    </style>
</head>
<body>
<div class="container">
    <div class="header-box">
        <h1>方劑效力值報表中心</h1>
        <div class="btn-group">
            <button class="btn btn-blue" onclick="getReport()">讀取資料庫</button>
            <button class="btn btn-orange" onclick="triggerInference('incremental')">增量計算</button>
            <button class="btn btn-purple" onclick="triggerInference('global')">全量計算</button>
            <button class="btn btn-green" onclick="saveToDatabase()">發布至資料庫</button>
        </div>
    </div>
    <div id="resultsContainer">
        <div style="text-align:center; color:#607d8b; padding:30px;">請點擊上方按鈕獲取數據。</div>
    </div>
</div>

<script>
	const GATEWAY_URL = `http://${window.location.hostname}:8080/api/medicinal`;
    const container = document.getElementById('resultsContainer');

    function render(data) {
        container.innerHTML = '';
        if (!data || Object.keys(data).length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:30px; color:#d32f2f; font-weight:bold; font-size:1.1rem;">⚠️ 目前 MySQL 資料庫中尚無任何經發布的正式效力值，請先點選上方按鍵計算並發布！</div>'; 
            return;
        }
        for (const [effectName, scores] of Object.entries(data)) {
            if (effectName === '_metadata') continue;
            let cardHTML = `<div class="effect-card"><div class="effect-title">🎯 療效：${effectName}</div><table><thead><tr><th style="width: 50%;">藥材</th><th style="width: 50%;">分值</th></tr></thead><tbody>`;
            const sortedDrugs = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            sortedDrugs.forEach(([drug, score]) => {
                let badgeClass = score >= 90 ? 'high-score' : (score >= 80 ? 'mid-score' : 'low-score');
                cardHTML += `<tr><td><strong>${drug}</strong></td><td><span class="score-badge ${badgeClass}">${score} 分</span></td></tr>`;
            });
            cardHTML += `</tbody></table></div>`; 
            container.innerHTML += cardHTML;
        }
    }

    async function getReport() {
        container.innerHTML = '<div style="text-align:center; color:#2e7d6b; padding:20px;">正在讀取正式效力值數據...</div>';
        try {
            const reportRes = await fetch(`${GATEWAY_URL}/inference/report`);
            const data = await reportRes.json(); 
            render(data);
        } catch (e) { 
            console.error(e);
            container.innerHTML = '<div style="text-align:center; color:#d32f2f; padding:20px;">讀取數據失敗。</div>'; 
        }
    }

    async function triggerInference(type) {
        container.innerHTML = '<div style="text-align:center; color:#2e7d6b; padding:20px;">正在執行圖論推論運算...</div>';
        try {
            const endpoint = type === 'global' ? '/inference/global' : '/inference/incremental';
            const inferRes = await fetch(`${GATEWAY_URL}${endpoint}`, { method: 'POST' });
            const result = await inferRes.json(); 
            alert(result.msg); 
            render(result.data);
        } catch (e) { 
            console.error(e);
            container.innerHTML = '<div style="text-align:center; color:#d32f2f; padding:20px;">推論運算失敗。</div>'; 
        }
    }

    async function saveToDatabase() {
        if (!confirm("確定要將當前暫存檔案中的權重數據正式發布，覆蓋並更新 MySQL 資料庫嗎？")) return;
        container.innerHTML = '<div style="text-align:center; color:#2e7d6b; padding:20px;">正在發布至資料庫...</div>';
        try {
            const saveRes = await fetch(`${GATEWAY_URL}/inference/save-to-db`, { method: 'POST' });
            const result = await saveRes.json();
            alert(result.msg);
            getReport();
        } catch (e) {
            console.error(e);
            alert("同步資料庫失敗");
            getReport();
        }
    }

    window.onload = getReport;
</script>
</body>
</html>
