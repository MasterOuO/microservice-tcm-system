<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>TCM 智能動態配藥系統</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #a2e8f5; 
            margin: 20px; 
            color: #333; 
        }
        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: rgba(255, 255, 255, 0.9); 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
        }
        h2 { border-bottom: 2px solid #29b6f6; padding-bottom: 10px; color: #0288d1; }
        .config-section { 
            display: grid; 
            grid-template-columns: 1fr 2fr; 
            gap: 20px; 
            background: #e1f5fe; 
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid #b3e5fc; 
            margin-bottom: 25px; 
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #01579b; }
        select, input[type="number"] { width: 100%; padding: 10px; border: 1px solid #b3e5fc; border-radius: 6px; box-sizing: border-box; }
        .effect-row, .syndrome-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .btn { 
            background: #2b75b0; color: white; padding: 12px 20px; border: none; border-radius: 6px; 
            cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; 
        }
        .btn:hover { background: #1f5784; }
        .btn-secondary { background: #00acc1; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; }
        .btn-secondary:hover { background: #00838f; }
        .recommend-box { margin-top: 20px; background: #fff; border: 1px solid #b3e5fc; border-radius: 8px; padding: 15px; }
        .drug-tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .drug-tag { 
            background: #2b75b0; color: white; padding: 8px 15px; border-radius: 6px; 
            cursor: pointer; font-weight: 500; border: 1px solid #1f5784; transition: all 0.2s; user-select: none; 
        }
        .drug-tag:hover { background: #1f5784; transform: translateY(-2px); }
        .drug-tag span { font-size: 11px; background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
        .prescription-view { margin-top: 30px; border: 2px dashed #0288d1; border-radius: 8px; padding: 20px; background: #f0fbfd; display: none; }
        .prescription-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; }
        .prescription-table th, .prescription-table td { border: 1px solid #e0e0e0; padding: 12px; text-align: left; }
        .prescription-table th { background: #e1f5fe; color: #01579b; }
        .delete-btn { color: #d32f2f; cursor: pointer; font-weight: bold; background: none; border: none; font-size: 14px; }
        .delete-btn:hover { text-decoration: underline; }
        .role-tag { font-weight: bold; padding: 4px 10px; border-radius: 4px; color: white; font-size: 13px; display: inline-block; }
        .role-君藥 { background: #d32f2f; }
        .role-臣藥 { background: #f57c00; }
        .role-佐藥 { background: #388e3c; }
        .role-使藥 { background: #1976d2; }
        .role-方劑 { background: #00acc1; } /* 完整方劑專屬青綠色標籤 */
        /* 專屬質感模式 Badge 樣式 */
        .type-badge {
        background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
        border: 1px solid #80deea;
        color: #006064;
        padding: 10px 14px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
        display: flex;
        align-items: center;
        box-shadow: inset 0 1px 2px rgba(255,255,255,0.8), 0 1px 3px rgba(0,0,0,0.05);
        }
        .type-badge span {
        letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>臨床動態配藥系統</h2>
    
    <!-- 區塊一：單味藥材動態加權推薦 -->
    <div class="config-section">
        <div>
            <div class="form-group">
                <label>藥材角色</label>
                <select id="prescriptionRole">
                    <option value="君藥">君藥 </option>
                    <option value="臣藥">臣藥 </option>
                    <option value="佐藥">佐藥 </option>
                    <option value="使藥">使藥 </option>
                </select>
            </div>
            <button class="btn" onclick="calculateScores()"> 藥材推薦</button>
        </div>
        <div>
            <label>療效與權重</label>
            <div id="effectWeightContainer">
                <div class="effect-row">
                    <select class="effect-select"><option value="">--請選擇療效--</option></select>
                    <input type="number" class="weight-input" min="0" max="1" step="0.1" value="1.0" placeholder="權重">
                </div>
                <div class="effect-row">
                    <select class="effect-select"><option value="">--請選擇療效--</option></select>
                    <input type="number" class="weight-input" min="0" max="1" step="0.1" value="0.5" placeholder="權重">
                </div>
                <div class="effect-row">
                    <select class="effect-select"><option value="">--請選擇療效--</option></select>
                    <input type="number" class="weight-input" min="0" max="1" step="0.1" value="0.2" placeholder="權重">
                </div>
            </div>
        </div>
    </div>

    <!-- 區塊二：證候選擇完整方劑  -->
    <div class="config-section">
    <div>
        <div class="form-group">
            <label>選用模式</label>
            <div class="type-badge">
                <span>科學中藥</span>
            </div>
        </div>
        <button class="btn btn-secondary" onclick="calculateSyndromePrescriptions()">方劑推薦</button>
    </div>
    <div>
        <label>證候與權重</label>
        <div id="syndromeWeightContainer">
            <div class="syndrome-row">
                <select class="syndrome-select"><option value="">--請選擇證候--</option></select>
                <input type="number" class="syndrome-weight-input" min="0" max="1" step="0.1" value="1.0" placeholder="權重">
            </div>
            <div class="syndrome-row">
                <select class="syndrome-select"><option value="">--請選擇證候--</option></select>
                <input type="number" class="syndrome-weight-input" min="0" max="1" step="0.1" value="0.5" placeholder="權重">
            </div>
            <div class="syndrome-row">
                <select class="syndrome-select"><option value="">--請選擇證候--</option></select>
                <input type="number" class="syndrome-weight-input" min="0" max="1" step="0.1" value="0.2" placeholder="權重">
            </div>
        </div>
    </div>
    </div>

    <!-- 推薦結果顯示區塊 -->
    <div id="recommendationBox" class="recommend-box" style="display:none;">
        <h3 id="recommendTitle" style="margin-top:0; color:#01579b;">推薦清單</h3>
        <div id="drugRecommendList" class="drug-tags"></div>
    </div>

    <div style="margin-top: 25px; text-align: right;">
        <button class="btn btn-secondary" onclick="finalizePrescription()">完成配藥</button>
    </div>

    <div id="prescriptionOutput" class="prescription-view">
        <h3 style="margin-top:0; color: #0288d1;">當前方劑</h3>
        <table class="prescription-table">
            <thead>
                <tr>
                    <th style="width: 15%">角色</th>
                    <th style="width: 20%">藥材/科學中藥</th>
                    <th style="width: 35%">療效/證候</th>
                    <th style="width: 15%">劑量</th>
                    <th style="width: 15%">操作</th>
                </tr>
            </thead>
            <tbody id="prescriptionBody"></tbody>
        </table>
    </div>
</div>

<script>
    const GATEWAY_URL = 'http://localhost:8080/api/medicinal';

    let inferenceReport = {}; 
    let contraindicationsList = {}; 
    let allAvailableDrugs = new Set(); 
    let selectedDrugs = new Set(); 
    let currentPrescription = []; 

    async function init() {
        try {
            // 1. 讀取推論權重數據
            const res = await fetch(`${GATEWAY_URL}/inference/report`);
            inferenceReport = await res.json();
            
            // 2. 讀取配伍禁忌字典
            const contraRes = await fetch(`${GATEWAY_URL}/dispensing/contraindications`);
            contraindicationsList = await contraRes.json();
            
            const effects = Object.keys(inferenceReport).filter(key => key !== '_metadata');
            effects.forEach(eff => {
                Object.keys(inferenceReport[eff]).forEach(drug => allAvailableDrugs.add(drug));
            });

            const selects = document.querySelectorAll('.effect-select');
            selects.forEach(select => {
                effects.forEach(eff => {
                    const opt = document.createElement('option');
                    opt.value = opt.textContent = eff; 
                    select.appendChild(opt);
                });
            });

            // 3. 載入證候選單數據
            const syndromeRes = await fetch(`${GATEWAY_URL}/syndrome/list`);
            const syndromes = await syndromeRes.json();
            const syndromeSelects = document.querySelectorAll('.syndrome-select');
            syndromeSelects.forEach(select => {
                syndromes.forEach(syn => {
                    const opt = document.createElement('option');
                    opt.value = opt.textContent = syn;
                    select.appendChild(opt);
                });
            });

            // === 4. 自動比對並帶入證候參數 (強效模糊匹配) ===
            const urlParams = new URLSearchParams(window.location.search);
            const incomingSyndrome = urlParams.get('syndrome');

            if (incomingSyndrome) {
                const targetSyndrome = decodeURIComponent(incomingSyndrome).trim();
                const firstSyndromeSelect = document.querySelector('.syndrome-select');

                if (firstSyndromeSelect) {
                    let matchedIndex = -1;

                    // 第一輪：完全相符比對
                    for (let i = 0; i < firstSyndromeSelect.options.length; i++) {
                        const optText = firstSyndromeSelect.options[i].text.trim();
                        const optVal = firstSyndromeSelect.options[i].value.trim();
                        if (optText === targetSyndrome || optVal === targetSyndrome) {
                            matchedIndex = i;
                            break;
                        }
                    }

                    // 第二輪：模糊包含比對 (例如 "心氣虛" 包含於 "心氣虛證")
                    if (matchedIndex === -1) {
                        for (let i = 1; i < firstSyndromeSelect.options.length; i++) {
                            const optText = firstSyndromeSelect.options[i].text.trim();
                            if (optText && (optText.includes(targetSyndrome) || targetSyndrome.includes(optText))) {
                                matchedIndex = i;
                                break;
                            }
                        }
                    }

                    // 如果成功找到對應項目
                    if (matchedIndex > 0) {
                        firstSyndromeSelect.selectedIndex = matchedIndex;
                        firstSyndromeSelect.value = firstSyndromeSelect.options[matchedIndex].value;

                        // 確保權重預設為 1.0
                        const firstWeightInput = document.querySelector('.syndrome-weight-input');
                        if (firstWeightInput && (!firstWeightInput.value || parseFloat(firstWeightInput.value) <= 0)) {
                            firstWeightInput.value = "1.0";
                        }

                        // 延遲 50ms 確保 DOM 狀態完全更新後執行計算
                        setTimeout(() => {
                            calculateSyndromePrescriptions();
                        }, 50);
                    } else {
                        console.warn(`[證候帶入警告] 資料庫中找不到與「${targetSyndrome}」相符的證候選項。`);
                    }
                }
            }

        } catch (e) {
            console.error(e);
            alert('數據初始化失敗，請確認後端 node server.js 是否已啟動！');
        }
    }

    // 單味藥材加權計算
    function calculateScores() {
        const rows = document.querySelectorAll('.effect-row');
        let selectedConfigs = [];
        rows.forEach(row => {
            const eff = row.querySelector('.effect-select').value;
            const weight = parseFloat(row.querySelector('.weight-input').value) || 0;
            if (eff && weight > 0) selectedConfigs.push({ eff, weight });
        });

        if (selectedConfigs.length === 0) {
            alert('請至少選擇一組療效並給予大於 0 的權重！'); 
            return;
        }

        const combinedEffectsText = selectedConfigs.map(config => config.eff).join('。');
        let drugScores = [];

        allAvailableDrugs.forEach(drug => {
            if (selectedDrugs.has(drug)) return; 

            let totalCompositeScore = 0;
            let totalWeightUsed = 0;

            selectedConfigs.forEach(config => {
                let score = (inferenceReport[config.eff] && inferenceReport[config.eff][drug] !== undefined) 
                            ? inferenceReport[config.eff][drug] 
                            : 0; 
                
                totalCompositeScore += score * config.weight;
                totalWeightUsed += config.weight;
            });

            let finalNormalizedScore = totalWeightUsed > 0 ? (totalCompositeScore / totalWeightUsed) : 0;
            drugScores.push({ drug, score: Math.round(finalNormalizedScore * 10) / 10, combinedEffects: combinedEffectsText });
        });

        drugScores.sort((a, b) => b.score - a.score);
        const top10 = drugScores.slice(0, 10);
        
        const titleElem = document.getElementById('recommendTitle');
        if (titleElem) titleElem.textContent = "推薦藥材 (單味)";
        
        const container = document.getElementById('drugRecommendList'); 
        container.innerHTML = '';
        
        if (top10.length === 0) {
            container.innerHTML = '<p style="color:#999; font-size:13px; padding-left:5px;">暫無符合推薦藥材</p>';
        } else {
            top10.forEach(item => {
                const tag = document.createElement('div'); 
                tag.className = 'drug-tag';
                tag.innerHTML = `${item.drug} <span>${item.score}分</span>`;
                tag.onclick = () => addDrugToPrescription(item.drug, item.combinedEffects);
                container.appendChild(tag);
            });
        }
        document.getElementById('recommendationBox').style.display = 'block';
    }

    // 多證候動態加權運算 (多方劑推薦)
    async function calculateSyndromePrescriptions() {
        const rows = document.querySelectorAll('.syndrome-row');
        let selectedConfigs = [];
        rows.forEach(row => {
            const syn = row.querySelector('.syndrome-select').value;
            const weight = parseFloat(row.querySelector('.syndrome-weight-input').value) || 0;
            if (syn && weight > 0) selectedConfigs.push({ syn, weight });
        });

        if (selectedConfigs.length === 0) {
            alert('請至少選擇一組證候並給予大於 0 的權重！');
            return;
        }

        try {
            let pScoresMap = {};
            let totalWeightUsed = 0;

            for (let config of selectedConfigs) {
                totalWeightUsed += config.weight;
                const res = await fetch(`${GATEWAY_URL}/syndrome/prescriptions-with-score?syndrome=${encodeURIComponent(config.syn)}`);
                const data = await res.json();

                if (Array.isArray(data)) {
                    data.forEach(item => {
                        if (!pScoresMap[item.prescription]) {
                            pScoresMap[item.prescription] = { totalScore: 0 };
                        }
                        pScoresMap[item.prescription].totalScore += item.effect_value * config.weight;
                    });
                }
            }

            const combinedSyndromesText = selectedConfigs.map(c => c.syn).join(' + ');
            let rankedPrescriptions = [];

            Object.keys(pScoresMap).forEach(pName => {
                if (selectedDrugs.has(pName)) return; 
                let finalScore = totalWeightUsed > 0 ? (pScoresMap[pName].totalScore / totalWeightUsed) : 0;
                rankedPrescriptions.push({
                    name: pName,
                    score: Math.round(finalScore * 10) / 10,
                    combinedSyndromes: combinedSyndromesText
                });
            });

            rankedPrescriptions.sort((a, b) => b.score - a.score);
            const top10 = rankedPrescriptions.slice(0, 10);

            const titleElem = document.getElementById('recommendTitle');
            if (titleElem) titleElem.textContent = "推薦科學中藥";
            
            const container = document.getElementById('drugRecommendList');
            container.innerHTML = '';

            if (top10.length === 0) {
                container.innerHTML = '<p style="color:#999; font-size:13px; margin:0;">暫無符合之推薦方劑</p>';
            } else {
                top10.forEach(item => {
                    const tag = document.createElement('div');
                    tag.className = 'drug-tag';
                    tag.style.background = '#00acc1'; 
                    tag.style.borderColor = '#00838f';
                    tag.innerHTML = `${item.name} <span>${item.score}分</span>`;
                    tag.onclick = () => addSyndromePrescription(item.name, item.combinedSyndromes);
                    container.appendChild(tag);
                });
            }
            document.getElementById('recommendationBox').style.display = 'block';

        } catch (e) {
            console.error('多證候方劑計算失敗', e);
            alert('計算失敗，請確認後端伺服器！');
        }
    }

    function addSyndromePrescription(prescriptionName, combinedSyndromes) {
        selectedDrugs.add(prescriptionName);
        
        currentPrescription.push({ 
            role: '方劑', 
            name: prescriptionName, 
            effect: `${combinedSyndromes}` 
        });
        
        calculateSyndromePrescriptions(); 
        renderPrescriptionTable(); 
    }

    function addDrugToPrescription(drugName, combinedEffects) {
        const role = document.getElementById('prescriptionRole').value;
        selectedDrugs.add(drugName); 
        currentPrescription.push({ role, name: drugName, effect: combinedEffects || '動態配伍綜合調和' });
        calculateScores(); 
        renderPrescriptionTable();
    }

    function renderPrescriptionTable() {
        const tbody = document.getElementById('prescriptionBody'); 
        tbody.innerHTML = ''; 
        currentPrescription.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="role-tag role-${item.role}">${item.role}</span></td>
                <td style="font-weight: 600; color: #2c3e50;">${item.name}</td>
                <td style="color: #333; font-size: 14px; font-weight: 500;">${item.effect}</td>
                <td><input type="number" style="padding:6px; width:80px;" min="0.5" step="0.5" value="1.0"></td>
                <td><button class="delete-btn" onclick="removeDrug(${index}, '${item.name}')">❌ 移除</button></td>
            `;
            tbody.appendChild(tr);
        });
        document.getElementById('prescriptionOutput').style.display = currentPrescription.length > 0 ? 'block' : 'none';
    }

    function finalizePrescription() {
        if (currentPrescription.length === 0) {
            alert('目前處方箋內尚無任何藥材，請先點選上方推薦藥材加入！'); 
            return;
        }

        for (let i = 0; i < currentPrescription.length; i++) {
            const drugA = currentPrescription[i].name;
            if (contraindicationsList[drugA]) {
                const toxicCompanions = contraindicationsList[drugA];
                for (let j = i + 1; j < currentPrescription.length; j++) {
                    const drugB = currentPrescription[j].name;
                    if (toxicCompanions.includes(drugB)) {
                        alert(`❌ 觸發中醫臨床配伍禁忌！\n\n目前處方箋中同時包含了【${drugA}】與【${drugB}】。\n這兩味藥物在資料庫設定中屬於『十八反 / 十九畏』的絕對禁忌組合，系統已進行硬性攔截，請重新審查病機！`);
                        return;
                    }
                }
            }
        }
        renderPrescriptionTable();
        document.getElementById('prescriptionOutput').style.display = 'block';
        document.getElementById('prescriptionOutput').scrollIntoView({ behavior: 'smooth' });
    }

    function removeDrug(index, drugName) {
        selectedDrugs.delete(drugName); 
        currentPrescription.splice(index, 1); 
        renderPrescriptionTable();
        if (document.getElementById('recommendationBox').style.display === 'block') {
            const titleElem = document.getElementById('recommendTitle');
            if (titleElem && titleElem.textContent.includes('單味')) {
                calculateScores();
            } else {
                calculateSyndromePrescriptions();
            }
        }
    }
    
    window.onload = init;
</script>
</body>
</html>
