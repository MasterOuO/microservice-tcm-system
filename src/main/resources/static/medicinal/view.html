<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>方劑資料總表 - 格式優化版</title>
    <style>
        body { 
            font-family: "Microsoft JhengHei", sans-serif; 
            padding: 30px; 
            background: #dcf2ea; 
            color: #2c3e50;
        }
        .table-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(46, 125, 107, 0.08);
        }
        .header-box { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #b2dfdb; 
            padding-bottom: 12px; 
            margin-bottom: 20px; 
        }
        h1 { margin: 0; font-size: 1.6rem; color: #1b5e20; }
        
        table { width: 100%; border-collapse: collapse; table-layout: fixed; border-radius: 6px; overflow: hidden; }
        th, td { border: 1px solid #d0e4de; padding: 12px; text-align: left; word-wrap: break-word; vertical-align: top; font-size: 14px; line-height: 1.6; }
        th { background-color: #e8f5e9; font-weight: bold; text-align: center; color: #1b5e20; }
        
        .col-1 { width: 8%; }  
        .col-2 { width: 10%; } 
        .col-rest { width: 16.4%; } 

        @media print {
            .no-print { display: none; }
            body { padding: 0; background: #fff; }
            table { font-size: 11px; }
            .table-container { box-shadow: none; padding: 0; }
        }

        .btn-print { 
            background: #2e7d6b; 
            color: white; 
            border: none; 
            padding: 9px 18px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: bold; 
            transition: all 0.2s;
        }
        .btn-print:hover { background: #236354; }
    </style>
</head>
<body>

<div class="table-container">
    <div class="header-box">
        <h1>中醫方劑研究資料匯總表</h1>
        <button class="btn-print no-print" onclick="window.print()">🖨️ 儲存為 PDF / 列印</button>
    </div>

    <table id="dataTable">
        <thead>
            <tr>
                <th class="col-1">方劑</th>
                <th class="col-2">症候</th>
                <th class="col-rest">君</th>
                <th class="col-rest">臣</th>
                <th class="col-rest">佐</th>
                <th class="col-rest">使</th>
                <th class="col-rest">偏序關係</th>
            </tr>
        </thead>
        <tbody id="dataBody"></tbody>
    </table>
</div>

<script>
	const GATEWAY_URL = `http://${window.location.hostname}:8080/api/medicinal`;

    function formatText(text) {
        if (!text) return '';
        return text.toString().replace(/;/g, '<br>');
    }

    async function fetchData() {
        try {
            const res = await fetch(`${GATEWAY_URL}/all`);
            const data = await res.json();
            const body = document.getElementById('dataBody');
            
            if (!data || data.length === 0) {
                body.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px; color:#888;">目前尚無資料</td></tr>';
                return;
            }

            body.innerHTML = ''; 
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight:bold; color:#2e7d6b;">${formatText(row.name)}</td>
                    <td>${formatText(row.symptoms)}</td>
                    <td>${formatText(row.king)}</td>
                    <td>${formatText(row.minister)}</td>
                    <td>${formatText(row.assistant)}</td>
                    <td>${formatText(row.envoy)}</td>
                    <td>${formatText(row.relation)}</td>
                `;
                body.appendChild(tr);
            });
        } catch (e) {
            console.error(e);
            alert("讀取失敗，請確認 Gateway (8080) 與 Node.js (3000) 是否已啟動。");
        }
    }

    window.onload = fetchData;
</script>

</body>
</html>
