
#(DataSource Configuration & DataSourceProperties)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/springtcm?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=MyNewPass
spring.thymeleaf.encoding=UTF-8

#Hibernate ddl auto (create, create-drop, validate, update)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.Type=TRACE
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

#spring cloud
spring.application.name=medicinal
server.port=8092
spring.application.name=medicinal
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/