# ===============================
# Server
# ===============================
server.port=8080
spring.application.name=api-gateway

# ===============================
# Eureka
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ===============================
# Spring Cloud Gateway - Route
# ===============================
 spring.cloud.gateway.routes[0].id=patient
 spring.cloud.gateway.routes[0].uri=lb://patient-service
 spring.cloud.gateway.routes[0].predicates[0]=Path=/tcm/patients/**
 spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2
 
server.forward-headers-strategy=framework

# --- route to patient-service ---

# Static resources
spring.cloud.gateway.routes[1].id=static-to-patient
spring.cloud.gateway.routes[1].uri=lb://patient-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/**

# differentiation Route
spring.cloud.gateway.routes[2].id=differentiation-service
spring.cloud.gateway.routes[2].uri=lb://differentiation
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/load-diff/**


# acupuncture Route
spring.cloud.gateway.routes[3].id=acupuncture-service
spring.cloud.gateway.routes[3].uri=lb://acupuncture
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/acupuncture/**

# medicinal Route
spring.cloud.gateway.routes[3].id=medicinal-service
spring.cloud.gateway.routes[3].uri=lb://medicinal
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/medicinal/**

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.com.netflix.discovery=INFO
logging.level.org.springframework.cloud.netflix.eureka=INFO

