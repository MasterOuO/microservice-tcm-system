#(DataSource Configuration & DataSourceProperties)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/springtcm_compute?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.thymeleaf.encoding=UTF-8

#Hibernate ddl auto (create, create-drop, validate, update)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.Type=TRACE
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update



eureka.instance.prefer-ip-address=true

#DiffServiceConfig use


server.port=8071
spring.application.name=differentiation
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

server.forward-headers-strategy=framework

