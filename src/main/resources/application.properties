# ===============================
# Server
# ===============================
server.port=8080
spring.application.name=api-gateway

# ===============================
# Eureka
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ===============================
# UI CORS
# ===============================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:8091
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[4]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# ===============================
# Spring Cloud Gateway - Route
# ===============================
 spring.cloud.gateway.routes[0].id=patient
 spring.cloud.gateway.routes[0].uri=lb://patient-service
 spring.cloud.gateway.routes[0].predicates[0]=Path=ui/**
 #spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2
 
server.forward-headers-strategy=framework

# --- route to patient-service ---

# Static resources
#spring.cloud.gateway.routes[4].id=static-to-patient
#spring.cloud.gateway.routes[4].uri=lb://patient-test
#spring.cloud.gateway.routes[4].predicates[0]=Path=/api/tcm/**

# differentiation Route
spring.cloud.gateway.routes[1].id=differentiation-service
spring.cloud.gateway.routes[1].uri=lb://differentiation
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/diff/**, /diffgraph/**


# acupuncture Route
spring.cloud.gateway.routes[2].id=acupuncture-service
spring.cloud.gateway.routes[2].uri=lb://acupuncture
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/acupuncture/**

# medicinal Route
spring.cloud.gateway.routes[3].id=medicinal-service
spring.cloud.gateway.routes[3].uri=lb://medicinal
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/medicinal/**

logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.com.netflix.discovery=INFO
logging.level.org.springframework.cloud.netflix.eureka=INFO

